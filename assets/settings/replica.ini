; Building layers preserve existing asset composition; state-specific capabilities
; such as repair/superweapons still need their own simulation states.
[BuildingDefaults]
Layers=Base,Bib:UnderUnit,Anim.IdleAnim,Anim.ActiveAnim,Anim.ActiveAnimTwo,Anim.ActiveAnimThree,Anim.ActiveAnimFour

[Building.GAPOWR]
Layers=Base,Anim.ActiveAnim
AnimationFrameLimit=8

[Building.GAPILE]
Layers=Base,Anim.ActiveAnim

[Building.GATECH]
Layers=Base,Anim.ActiveAnim

[Building.GAOREP]
Layers=Base,Anim.ActiveAnim

[Building.GAGAP]
Layers=Base,Anim.ActiveAnim

[Building.GAPRIS]
Layers=Base,Anim.ActiveAnim

[Building.GAREFN]
Layers=Base,Bib,Anim.ActiveAnimThree,Anim.ActiveAnimTwo,Anim.ActiveAnim

[Building.GAWEAP]
Layers=Base_1:UnderUnit,Base_2:OverUnit,Anim.ActiveAnim:OverUnit,Anim.ActiveAnimTwo:OverUnit,Bib:UnderUnit
LayeredFactory=yes
DeferOverUnit=yes

; Cell offsets use the northwest Foundation start. Routes/timing remain provisional.
[Factory.GAWEAP]
ExitPath=2:1,3:1,4:1,5:1
PrepareFrames=12
ClearFrames=6

[Building.NAWEAP]
Layers=Base,Base_1:ProductionUnderUnit,Bib:UnderUnit,Anim.ActiveAnim,Base_2:ProductionOverUnit,Anim.ActiveAnim:ProductionOverUnit
LayeredFactory=yes
ProductionSplit=yes

[Factory.NAWEAP]
ExitPath=2:1,3:1,4:1,5:1
PrepareFrames=12
ClearFrames=6

[Building.GAAIRC]
Layers=Base,Anim.ActiveAnimThree,Bib,Anim.ActiveAnimTwo,Anim.ActiveAnim

[Building.GAYARD]
Layers=Base,Anim.ActiveAnimThree,Anim.ProductionAnim

[Building.NAYARD]
Layers=Base,Anim.ActiveAnimThree,Anim.ProductionAnim

[Building.GADEPT]
Layers=Base,Bib,Anim.IdleAnim

[Building.NADEPT]
Layers=Base,Bib,Anim.IdleAnim

[Building.GACSPH]
Layers=Base,Anim.SuperAnim

[Building.GAWETH]
Layers=Base,Anim.SuperAnim

