; Replica resource mappings and provisional simulation conversions.
; Raw Strength, Speed, ROF and other gameplay fields remain in rules.ini.
; Sandbox retains the existing free building placement workflow.
[GameSpeed]
; GS level, not the reversed original engine delay index.
Mode=Multiplayer
Level=6

[Simulation]
; Speed/ROT, BuildSpeed/BuildupTime and BuildTimeMultiplier are imported from rules.ini.
; Optional test/demo override: 0 uses rule-derived production, even in Sandbox.
ProductionFramesOverride=0
PathRetryFrames=60
BlockedRetryFrames=16
DeployFrames=90
StartingCredits=50000
Sandbox=yes
; Sandbox bypasses national restrictions. With Sandbox=no, SNIPE requires British.
PlayerHouse=British
EngineerEntryFrames=12
UnloadFrames=8
; Compatibility body radius (OpenRA RA2: 128/1024 cell), not a weapon spread.
InfantryHitRadiusLeptons=32
; Compatibility collateral explosion strength, pending vanilla frame traces.
DefaultDeathDamagePercent=5

